name: Deploy Linh Flower House

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      CLOUDFLARE_WORKER_NAME: linh-flower-house
      CLOUDFLARE_D1_DATABASE_NAME: linh-flower-house-db
      CLOUDFLARE_R2_BUCKET_NAME: linh-flower-house-images
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/write-production-config.mjs
      - run: npx wrangler d1 migrations apply DB --remote --config dist/server/wrangler.production.json
      - run: printf %s "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD --config dist/server/wrangler.production.json
      - run: npx wrangler deploy --config dist/server/wrangler.production.json
