name: Deploy Linh Flower House

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_WORKER_NAME: linh-flower-house
      CLOUDFLARE_D1_DATABASE_NAME: linh-flower-house-db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: deployment_config
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_D1_DATABASE_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deployment pending::Add the required GitHub Actions secrets to enable automatic deploys."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.deployment_config.outputs.ready == 'true'
        run: npm ci
      - if: steps.deployment_config.outputs.ready == 'true'
        run: npm run build
      - if: steps.deployment_config.outputs.ready == 'true'
        run: node scripts/write-production-config.mjs
      - if: steps.deployment_config.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote --config dist/server/wrangler.production.json
      - if: steps.deployment_config.outputs.ready == 'true'
        run: npx wrangler deploy --config dist/server/wrangler.production.json
