name: Deploy Linh Flower House

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      CLOUDFLARE_WORKER_NAME: linh-flower-house
      CLOUDFLARE_D1_DATABASE_NAME: linh-flower-house-db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: deployment_config
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_D1_DATABASE_ID" ] || [ -z "$ADMIN_PASSWORD" ] || [ -z "$CLOUDINARY_CLOUD_NAME" ] || [ -z "$CLOUDINARY_API_KEY" ] || [ -z "$CLOUDINARY_API_SECRET" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deployment pending::Add the required GitHub Actions secrets to enable automatic deploys."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.deployment_config.outputs.ready == 'true'
        run: npm ci
      - if: steps.deployment_config.outputs.ready == 'true'
        run: npm run build
      - if: steps.deployment_config.outputs.ready == 'true'
        run: node scripts/write-production-config.mjs
      - if: steps.deployment_config.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote --config dist/server/wrangler.production.json
      - if: steps.deployment_config.outputs.ready == 'true'
        run: printf %s "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD --config dist/server/wrangler.production.json
      - if: steps.deployment_config.outputs.ready == 'true'
        run: printf %s "$CLOUDINARY_CLOUD_NAME" | npx wrangler secret put CLOUDINARY_CLOUD_NAME --config dist/server/wrangler.production.json
      - if: steps.deployment_config.outputs.ready == 'true'
        run: printf %s "$CLOUDINARY_API_KEY" | npx wrangler secret put CLOUDINARY_API_KEY --config dist/server/wrangler.production.json
      - if: steps.deployment_config.outputs.ready == 'true'
        run: printf %s "$CLOUDINARY_API_SECRET" | npx wrangler secret put CLOUDINARY_API_SECRET --config dist/server/wrangler.production.json
      - if: steps.deployment_config.outputs.ready == 'true'
        run: npx wrangler deploy --config dist/server/wrangler.production.json
